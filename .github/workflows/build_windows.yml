name: Build and Release Lambdanio Full

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Preparar vcpkg
        run: |
          # Clonamos vcpkg de forma superficial para que sea rápido y no falle
          git clone --depth=1 https://github.com
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Configurar CMake (Forzando VS 2022)
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_GUI=ON `
            -DENABLE_IPC=OFF `
            -DWITH_INCOMPATIBLE_BDB=ON `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Compilar Lambdanio
        run: cmake --build build --config Release -j 2

      - name: Crear archivo ZIP
        shell: pwsh
        run: |
          # Buscamos los .exe y los metemos en el zip
          $files = Get-ChildItem -Path "build/src/Release/*.exe", "build/src/qt/Release/*.exe"
          Compress-Archive -Path $files -DestinationPath Lambdanio-Windows-Full.zip

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Lambdanio-Windows-Full.zip
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
