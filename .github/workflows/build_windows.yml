name: Build and Release Lambdanio Full

on:
  push:
    tags:
      - 'v*' # Se activa al crear un tag (v1.0.2, etc.)
  workflow_dispatch: # Permite darle al botón "Run" manualmente

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # ESTE PASO ES EL QUE TE SALVARÁ DE ESPERAR 1.5h LA PRÓXIMA VEZ
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            build/vcpkg_installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Preparar vcpkg
        run: |
          if (!(Test-Path vcpkg)) {
            git clone https://github.com/microsoft/vcpkg
            .\vcpkg\bootstrap-vcpkg.bat
          }

      - name: Configurar CMake
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_GUI=ON `
            -DENABLE_IPC=OFF `
            -DWITH_INCOMPATIBLE_BDB=ON `
            -DBUILD_TESTS=OFF `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      
      - name: Compilar Lambdanio
        # Usamos -j 1 para que no explote la RAM al compilar el GUI
        run: cmake --build build --config Release -j 1

      - name: Crear archivo ZIP con binarios
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "build/src/Release/*.exe", "build/src/qt/Release/*.exe" -ErrorAction SilentlyContinue
          if ($files) {
            Compress-Archive -Path $files -DestinationPath Lambdanio-Windows-Full.zip
          } else {
            Write-Error "No se encontraron ejecutables. La compilación pudo haber fallado silenciosamente."
            exit 1
          }

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Lambdanio-Windows-Full.zip
          name: Release ${{ github.ref_name }}
          body: "Compilación exitosa de Lambdanio para Windows."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
