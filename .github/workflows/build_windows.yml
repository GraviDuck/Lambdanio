name: Build and Release Lambdanio Full

on:
  push:
    tags:
      - 'v*'
      - 'Windows' # Se activa al crear el tag 'Windows'
  workflow_dispatch: # Permite lanzarlo a mano si quieres

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write # Permiso necesario para subir archivos a la Release
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            ${{ github.workspace }}/build/vcpkg_installed
            C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Preparar vcpkg
        run: |
          if (!(Test-Path vcpkg)) {
            git clone https://github.com/microsoft/vcpkg
            .\vcpkg\bootstrap-vcpkg.bat
          }

      - name: Configurar CMake
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_GUI=ON `
            -DENABLE_IPC=OFF `
            -DWITH_INCOMPATIBLE_BDB=ON `
            -DBUILD_TESTS=OFF `
            -DBUILD_UNIT_TESTS=OFF `
            -DCMAKE_INSTALL_PREFIX=dist `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_EXE_LINKER_FLAGS="/INCREMENTAL:NO /OPT:REF /OPT:ICF"

      - name: Compilar Lambdanio
        run: cmake --build build --config Release -j 1

      - name: Organizar Binarios
        run: cmake --install build --config Release

      - name: Ver contenido de carpeta dist
        shell: pwsh
        run: |
          Write-Host "--- Verificando ejecutables instalados ---"
          if (Test-Path "dist/bin") { Get-ChildItem "dist/bin" | Select-Object Name, Length }
          else { Write-Warning "La carpeta dist/bin no existe" }

      - name: Crear archivo ZIP con binarios
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "dist/bin/*.exe", "build/src/Release/*.exe", "build/src/qt/Release/*.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -Unique
          if ($files) {
            Write-Host "Archivos encontrados para el ZIP: $files"
            Compress-Archive -Path $files -DestinationPath Lambdanio-Windows-Full.zip
          } else {
            Write-Error "No se encontraron ejecutables (.exe). Revisa el log de compilación."
            exit 1
          }

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: Lambdanio-Windows-Full.zip
          tag_name: ${{ github.ref_name || 'Windows' }}
          name: Release ${{ github.ref_name || 'Windows' }}
          body: "Compilación automática de Lambdanio para Windows. Incluye Daemon, CLI y GUI."
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
